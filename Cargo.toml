[package]
name = "mnrekord"
version = "0.2.0"
edition = "2021"
description = "A simple Windows screen recorder: region capture with locked aspect ratio, system audio, H.264/AAC MP4 output."
readme = "README.md"
publish = false
license = "MIT"
authors = ["Miklós Németh"]
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
gif = "0.14.2"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26.1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com",
  "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Variant",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
